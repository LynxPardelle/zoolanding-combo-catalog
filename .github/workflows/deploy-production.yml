name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require test merge
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "Allowing initial production branch bootstrap."
            exit 0
          fi
          git fetch origin test main
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          if [[ "$parent_count" -lt 2 ]]; then
            echo "Deploying production requires a merge commit from test."
            exit 1
          fi
          second_parent="$(git rev-list --parents -n 1 HEAD | awk '{print $3}')"
          git merge-base --is-ancestor "$second_parent" origin/test

  deploy:
    runs-on: ubuntu-latest
    needs: guard
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up SAM
        uses: aws-actions/setup-sam@v3
      - name: Validate combo catalog config
        shell: bash
        env:
          COMBO_CATALOG_CONFIG_JSON_BASE64: ${{ secrets.COMBO_CATALOG_CONFIG_JSON_BASE64 }}
          COMBO_CATALOG_CONFIG_READY: ${{ vars.COMBO_CATALOG_CONFIG_READY }}
          COMBO_CATALOG_ENVIRONMENT: prod
          AUTH_SESSION_TABLE_NAME: ${{ vars.AUTH_SESSION_TABLE_NAME }}
          AUTH_USER_STATE_TABLE_NAME: ${{ vars.AUTH_USER_STATE_TABLE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${COMBO_CATALOG_CONFIG_READY:-}" != "true" ]]; then
            echo "Skipping deploy: COMBO_CATALOG_CONFIG_READY is not true for this environment."
            exit 0
          fi
          test -n "${AUTH_SESSION_TABLE_NAME:-}" || { echo "AUTH_SESSION_TABLE_NAME is required for deploy"; exit 1; }
          test -n "${AUTH_USER_STATE_TABLE_NAME:-}" || { echo "AUTH_USER_STATE_TABLE_NAME is required for deploy"; exit 1; }
          output_path="$RUNNER_TEMP/combo-catalog-config.compact.b64"
          export OUTPUT_CONFIG_PATH="$output_path"
          python - <<'PY'
          import base64, json, os, pathlib
          import lambda_function as combo_catalog
          raw = os.environ.get("COMBO_CATALOG_CONFIG_JSON_BASE64", "")
          if not raw:
              raise SystemExit("COMBO_CATALOG_CONFIG_JSON_BASE64 is required for deploy")
          decoded = base64.b64decode(raw).decode("utf-8")
          parsed = json.loads(decoded)
          compact = base64.b64encode(json.dumps(parsed, separators=(",", ":")).encode("utf-8")).decode("ascii")
          os.environ["COMBO_CATALOG_CONFIG_JSON_BASE64"] = compact
          combo_catalog._load_config()
          pathlib.Path(os.environ["OUTPUT_CONFIG_PATH"]).write_text(compact, encoding="utf-8")
          PY
      - name: Configure AWS credentials
        if: vars.COMBO_CATALOG_CONFIG_READY == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Test and deploy
        if: vars.COMBO_CATALOG_CONFIG_READY == 'true'
        shell: bash
        env:
          AUTH_SESSION_TABLE_NAME: ${{ vars.AUTH_SESSION_TABLE_NAME }}
          AUTH_USER_STATE_TABLE_NAME: ${{ vars.AUTH_USER_STATE_TABLE_NAME }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"
          sam validate
          sam build --no-cached
          COMBO_CATALOG_CONFIG_JSON_BASE64="$(cat "$RUNNER_TEMP/combo-catalog-config.compact.b64")"
          sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "EnvironmentName=prod" "ComboCatalogConfigJsonBase64=${COMBO_CATALOG_CONFIG_JSON_BASE64}" "AuthSessionTableName=${AUTH_SESSION_TABLE_NAME}" "AuthUserStateTableName=${AUTH_USER_STATE_TABLE_NAME}" "LogLevel=INFO"
