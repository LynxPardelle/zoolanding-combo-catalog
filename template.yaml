AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding generic combo catalog for reusable Angora CSS presets

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
  ComboCatalogConfigJsonBase64:
    Type: String
    Default: eyJ2ZXJzaW9uIjoxLCJwcm9maWxlcyI6W119
    NoEcho: true
  AuthSessionTableName:
    Type: String
  AuthUserStateTableName:
    Type: String
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR

Globals:
  Function:
    Runtime: python3.13
    Timeout: 20
    MemorySize: 256
    Tracing: PassThrough

Resources:
  ComboCatalogApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: EnvironmentName
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 15

  ComboCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ComboCatalogFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-FunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ComboCatalogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                  - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::GetAtt:
                      - ComboCatalogTable
                      - Arn

  ComboCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      FunctionName:
        Fn::Sub: ${AWS::StackName}-Function
      Description: Provides generic combo catalog read/action workflows for Zoolanding drafts.
      Role:
        Fn::GetAtt:
          - ComboCatalogFunctionRole
          - Arn
      Environment:
        Variables:
          COMBO_CATALOG_ENVIRONMENT:
            Ref: EnvironmentName
          COMBO_CATALOG_CONFIG_JSON_BASE64:
            Ref: ComboCatalogConfigJsonBase64
          COMBO_CATALOG_TABLE_NAME:
            Ref: ComboCatalogTable
          AUTH_SESSION_TABLE_NAME:
            Ref: AuthSessionTableName
          AUTH_USER_STATE_TABLE_NAME:
            Ref: AuthUserStateTableName
          LOG_LEVEL:
            Ref: LogLevel
      Events:
        Read:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ComboCatalogApi
            Method: POST
            Path: /features/combo-catalog/read
        Action:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ComboCatalogApi
            Method: POST
            Path: /features/combo-catalog/action
        OptionsRead:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ComboCatalogApi
            Method: OPTIONS
            Path: /features/combo-catalog/read
        OptionsAction:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ComboCatalogApi
            Method: OPTIONS
            Path: /features/combo-catalog/action

Outputs:
  ApiEndpoint:
    Description: Combo catalog HTTP API endpoint.
    Value:
      Fn::Sub: https://${ComboCatalogApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  FunctionName:
    Description: Combo catalog Lambda function name.
    Value:
      Ref: ComboCatalogFunction
  TableName:
    Description: Combo catalog table name.
    Value:
      Ref: ComboCatalogTable
